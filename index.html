const cor=t=>`var(${COL[t]})`;
// agregações
const gm=G.map(([d,a,ga,b,gb])=>({d,a,ga,b,gb,w:ga>gb?a:gb>ga?b:'Empate',lg:a=='ARGENTINA'?'Brasil × Argentina':'Chelsea × Barcelona'}));
const lgs=['Brasil × Argentina','Chelsea × Barcelona'];
function lgStat(l){const g=gm.filter(x=>x.lg==l),t1=g[0].a,t2=g[0].b,s={n:g.length,[t1]:0,[t2]:0,E:0,gp:{[t1]:0,[t2]:0},t1,t2};g.forEach(x=>{x.w=='Empate'?s.E++:s[x.w]++;s.gp[x.a]+=x.ga;s.gp[x.b]+=x.gb});return s}
const ps=P.map((p,i)=>({i,n:p[0],pos:p[1],st:p[2],cat:p[3],pr:0,g:0,am:0,vm:0,V:0,E:0,D:0,pres:Array(DT.length).fill(0)}));
R.forEach(([d,i,t,g,a,v,r])=>{const p=ps[i];p.pr++;p.g+=g;p.am+=a;p.vm+=v;if(r)p[r]++;p.pres[d]=1});
ps.forEach(p=>{p.pts=p.V*3+p.E;p.ap=p.pr?p.pts/(p.pr*3):0;p.mg=p.pr?p.g/p.pr:0;p.f=DT.length-p.pr;p.as=p.pr/DT.length;p.pt=p.pts+p.pr});ps.forEach(p=>p.rk=1+ps.filter(q=>q.pt>p.pt||(q.pt==p.pt&&q.i<p.i)).length);
const tot={g:R.reduce((s,r)=>s+r[3],0),am:R.reduce((s,r)=>s+r[4],0),vm:R.reduce((s,r)=>s+r[5],0)};
const TABS=['Visão geral','Jogos','Artilharia','Jogadores','Presença','Disciplina'];let tab=0;
$('#nav').innerHTML=TABS.map((t,i)=>`<button onclick="go(${i})">${t}</button>`).join('');
function go(i){tab=i;[...$('#nav').children].forEach((b,j)=>b.classList.toggle('on',i==j));$('#m').innerHTML=[ov,jg,ar,jo,pe,di][i]();if(window.after)after();window.after=null}
const kpi=(v,l)=>`<div class="c k"><b>${v}</b><span>${l}</span></div>`;
function tbl(h,rows,id){return `<div class="wrap"><table id="${id||''}"><thead><tr>${h.map((x,i)=>`<th class="${x[1]?'n':''}" data-i="${i}">${x[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${h[i][1]?'n':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function sortable(id){const t=$('#'+id);t.querySelectorAll('th').forEach(th=>th.onclick=()=>{const i=+th.dataset.i,d=th.dir=-(th.dir||-1),b=t.tBodies[0];[...b.rows].sort((a,c)=>{const x=a.cells[i].textContent.replace('%',''),y=c.cells[i].textContent.replace('%','');return(isNaN(x)||isNaN(y)?x.localeCompare(y):x-y)*d}).forEach(r=>b.append(r))})}
function ov(){let h=`<div class="grid">${kpi(gm.length,'Jogos disputados')}${kpi(tot.g,'Gols na súmula')}${kpi((gm.reduce((s,x)=>s+x.ga+x.gb,0)/gm.length).toFixed(1),'Gols por jogo (placar)')}${kpi(ps.filter(p=>p.pr).length,'Atletas que jogaram')}${kpi((R.length/DT.length).toFixed(1),'Presentes por domingo')}${kpi(tot.am+' / '+tot.vm,'Amarelos / Vermelhos')}</div>`;
h+='<h2>Disputas entre os técnicos</h2><div class="grid g2">'+lgs.map(l=>{const s=lgStat(l),a=s.t1,b=s.t2;return `<div class="c"><h3>${l} · ${s.n} jogos</h3><div class="row"><b style="color:${cor(a)}">${a}</b><div class="bar"><i style="width:${s[a]/s.n*100}%;background:${cor(a)}"></i><i style="width:${s.E/s.n*100}%;background:#8a8f9c"></i><i style="width:${s[b]/s.n*100}%;background:${cor(b)}"></i></div><b style="color:${cor(b)}">${b}</b></div><p>${a}: <b>${s[a]}V</b> · Empates: <b>${s.E}</b> · ${b}: <b>${s[b]}V</b><br><span class="sub">Gols: ${s.gp[a]} × ${s.gp[b]} · Aproveitamento ${a} ${pc((s[a]*3+s.E)/(s.n*3))} · ${b} ${pc((s[b]*3+s.E)/(s.n*3))}</span></p></div>`}).join('')+'</div>';
const sc=gm.length>0?(()=>{const W=720,H=200,m=24,n=gm.length,bw=(W-2*m)/n,mx=Math.max(...gm.map(x=>x.ga+x.gb));return `<svg viewBox="0 0 ${W} ${H}">${gm.map((x,i)=>{const h1=x.ga/mx*(H-50),h2=x.gb/mx*(H-50),X=m+i*bw;return `<rect x="${X+1}" y="${H-24-h1}" width="${bw/2-1}" height="${h1}" fill="${cor(x.a)}"><title>${fmt(x.d)} ${x.a} ${x.ga} × ${x.gb} ${x.b}</title></rect><rect x="${X+bw/2}" y="${H-24-h2}" width="${bw/2-1}" height="${h2}" fill="${cor(x.b)}"><title>${fmt(x.d)} ${x.a} ${x.ga} × ${x.gb} ${x.b}</title></rect>${i%4==0?`<text x="${X}" y="${H-8}" font-size="9" fill="var(--mu)">${fmt(x.d)}</text>`:''}`}).join('')}</svg>`})():'';
h+=`<h2>Gols por time em cada jogo</h2><div class="c">${sc}<p class="sub">${Object.keys(COL).map(t=>`<span class="chip" style="background:${cor(t)}"></span>${t}`).join(' &nbsp; ')}</p></div>`;
const top=[...ps].sort((a,b)=>b.g-a.g).slice(0,5),mx=top[0].g;
h+=`<h2>Top 5 artilheiros</h2><div class="c">${top.map(p=>`<div class="row"><span>${p.n}</span><div class="bar"><i style="width:${p.g/mx*100}%;background:var(--gold)"></i></div><b>${p.g}</b></div>`).join('')}</div>`;
const mt=[...gm].sort((a,b)=>Math.abs(b.ga-b.gb)-Math.abs(a.ga-a.gb))[0],mg=[...gm].sort((a,b)=>b.ga+b.gb-a.ga-a.gb)[0];
return h+`<h2>Destaques</h2><div class="grid g2"><div class="c"><h3>Maior goleada</h3>${fmt(mt.d)}: ${mt.a} ${mt.ga} × ${mt.gb} ${mt.b}</div><div class="c"><h3>Jogo com mais gols</h3>${fmt(mg.d)}: ${mg.a} ${mg.ga} × ${mg.gb} ${mg.b}</div></div>`}
function jg(){const rows=gm.map(x=>[x.d.split('-').reverse().join('/'),x.lg,`<b>${x.a}</b>`,`<b>${x.ga} × ${x.gb}</b>`,`<b>${x.b}</b>`,x.w=='Empate'?'<span class="tag E">Empate</span>':`<span class="tag" style="background:${cor(x.w)}">${x.w}</span>`]);
return `<div class="tools"><select id="f" onchange="fj()"><option value="">Todas as disputas</option>${lgs.map(l=>`<option>${l}</option>`).join('')}</select></div>`+tbl([['Data'],['Disputa'],['Clube 1'],['Placar',1],['Clube 2'],['Vencedor']],rows,'tj')+(window.after=()=>sortable('tj'),'')}
function fj(){const v=$('#f').value;[...$('#tj').tBodies[0].rows].forEach(r=>r.hidden=v&&r.cells[1].textContent!=v)}
function ar(){const L=[...ps].filter(p=>p.g>0).sort((a,b)=>b.g-a.g||a.pr-b.pr);return `<p class="sub">Todos os atletas com ao menos 1 gol (${L.length}). Clique nos títulos para ordenar.</p>`+tbl([['#',1],['Atleta'],['Gols',1],['Partidas',1],['Média',1],['Aproveit.',1]],L.map((p,k)=>[k+1,p.n,`<b>${p.g}</b>`,p.pr,p.mg.toFixed(2),pc(p.ap)]),'ta')+(window.after=()=>sortable('ta'),'')}
function jo(){return `<div class="tools"><input id="q" placeholder="Buscar atleta…" oninput="fp()"><select id="fs" onchange="fp()"><option value="">Todo status</option>${[...new Set(P.map(p=>p[2]))].map(s=>`<option>${s}</option>`).join('')}</select><select id="fo" onchange="fp()"><option value="">Toda posição</option>${[...new Set(P.map(p=>p[1]))].map(s=>`<option>${s}</option>`).join('')}</select></div>`+tbl([['Rank.',1],['Atleta'],['Posição'],['Status'],['Pres.',1],['Faltas',1],['Assid.',1],['V',1],['E',1],['D',1],['Pontos',1],['Gols',1],['Aproveit.',1]],[...ps].sort((a,b)=>a.rk-b.rk).map(p=>[p.rk,p.n,p.pos,p.st,p.pr,p.f,pc(p.as),p.V,p.E,p.D,'<b>'+p.pt+'</b>',p.g,pc(p.ap)]),'tp')+'<p class="sub">Ranking por pontos (critério do Painel): 1 por presença + 3 por vitória + 1 por empate. Empates de pontos seguem a ordem do cadastro.</p>'+(window.after=()=>sortable('tp'),'')}
function fp(){const q=$('#q').value.toLowerCase(),s=$('#fs').value,o=$('#fo').value;[...$('#tp').tBodies[0].rows].forEach(r=>{const c=r.cells;r.hidden=!(c[1].textContent.toLowerCase().includes(q)&&(!s||c[3].textContent==s)&&(!o||c[2].textContent==o))})}
function pe(){const mes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out'],pm=ps.map(p=>mes.map((_,m)=>{let a=0,t=0;DT.forEach((d,i)=>{if(+d.slice(5,7)-1==m){t++;a+=p.pres[i]}});return[a,t-a]}));
const mt=mes.map((_,m)=>R.filter(r=>+DT[r[0]].slice(5,7)-1==m).length);
let h=`<h2>Presentes por mês</h2><div class="c"><div class="grid" style="grid-template-columns:repeat(5,1fr)">${mes.map((m,i)=>`<div><b>${mt[i]}</b><br><span class="sub">${m}</span></div>`).join('')}</div></div><h2>Faltas por atleta e mês</h2><div class="wrap c"><table class="hm"><thead><tr><th>Class.</th><th>Atleta</th>${mes.map(m=>`<th>${m}</th>`).join('')}<th>Total</th><th>Pres.</th></tr></thead><tbody>`;
[...ps].sort((a,b)=>b.pr-a.pr).forEach(p=>{const rk=1+ps.filter(q=>q.pr>p.pr).length;h+=`<tr><td><b>${rk}º</b></td><td style="text-align:left">${p.n}</td>${pm[p.i].map(([a,f])=>`<td style="background:rgba(192,57,43,${Math.min(f/5,1)*.6})">${f}</td>`).join('')}<td><b>${p.f}</b></td><td><b>${p.pr}</b></td></tr>`});return h+'</tbody></table></div><p class="sub">Classificação por número de presenças (empates dividem a mesma posição). Faltas = domingos de 2026 em que o atleta não aparece na súmula.</p>'}
function di(){const L=[...ps].filter(p=>p.am||p.vm).sort((a,b)=>b.vm-a.vm||b.am-a.am);return `<div class="grid">${kpi(tot.am,'Cartões amarelos')}${kpi(tot.vm,'Cartões vermelhos')}${kpi(L.length,'Atletas advertidos')}</div><h2>Ranking de cartões</h2>`+tbl([['Atleta'],['Amarelos',1],['Vermelhos',1],['Partidas',1]],L.map(p=>[p.n,p.am,p.vm,p.pr]),'td')+(window.after=()=>sortable('td'),'')}
go(0)
</script></body></html>
